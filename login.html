<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopX - Login</title>

```
<link rel="stylesheet" href="newstyle.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
```

</head>

<body class="auth-body">

```
<div class="auth-container">

    <a href="Newwebsite.html" class="auth-logo">
        <span>Shop</span>X
    </a>

    <div class="auth-card">

        <div class="auth-icon">
            👤
        </div>

        <h1>Welcome Back!</h1>

        <p class="auth-subtitle">
            Login to continue shopping with ShopX.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="loginEmail">Email Address</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="auth-options">
                <label>
                    <input type="checkbox" id="rememberMe">
                    Remember me
                </label>

                <a href="#" onclick="forgotPassword(event)">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" class="auth-btn">
                Login →
            </button>

        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <p class="create-account">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

    </div>

    <a href="Newwebsite.html" class="back-home">
        ← Back to Shop
    </a>

</div>

<div id="authToast" class="auth-toast"></div>

<script src="auth.js"></script>
```

</body>
</html>
